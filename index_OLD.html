<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Porra Empresa</title>
    styles.css
</head>
<body>
    <div class="container">
        <h1>🏆 Porra Empresa 2026</h1>
        <form id="porraForm">

            <div class="grupo">
                <label>Nombre</label>
                <input type="text" id="nombre" required>
            </div>
            <h2>Jornada 1</h2>
            <div class="partido">

                <div class="equipos">
                    <span>Real Sociedad</span>
                    <span>vs</span>
                    <span>Athletic Club</span>
                </div>
                <div class="resultado">
                    <input
                        type="number"
                        min="0"
                        id="rsociedad">
                    <span>-</span>
                    <input
                        type="number"
                        min="0"
                        id="athletic">
                </div>
            </div>
            <div class="partido">
                <div class="equipos">
                    <span>Barcelona</span>
                    <span>vs</span>
                    <span>Real Madrid</span>
                </div>
                <div class="resultado">
                    <input
                        type="number"
                        min="0"
                        id="barcelona">
                    <span>-</span>
                    <input
                        type="number"
                        min="0"
                        id="madrid">
                </div>
            </div>
            <button type="submit">
                Enviar Pronóstico
            </button>
        </form>
        <div id="mensaje"></div>
    </div>
    app.jsscript>
</body>
</html>
